name: CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        build_type: [Debug, Release]
        include:
          - cxx: g++
            cc: gcc
          - cxx: clang++
            cc: clang
          - cxx: clang++
            build_type: Debug
            asan: ON
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.11' }
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: server/ui/frontend/package-lock.json
    - name: Install system dependencies
      # The runners point apt at azure.archive.ubuntu.com, which degrades
      # often enough to matter and does it by stalling rather than failing:
      # a bare `apt-get update` here sat for thirty minutes while the other
      # three matrix legs finished. archive.ubuntu.com answers normally.
      # Bounded and retried too, for the case where the mirror is not slow
      # but simply gone.
      timeout-minutes: 15
      run: |
        set -eu
        sudo sed -i 's|https\?://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
          /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
        for attempt in 1 2 3; do
          if sudo timeout 180 apt-get update; then
            break
          fi
          echo "apt-get update failed or stalled (attempt $attempt of 3)"
          sudo rm -rf /var/lib/apt/lists/*
          sleep 5
        done
        sudo timeout 600 apt-get install -y --no-install-recommends cppcheck clang-tidy
    - name: Install Python tools
      run: pip install conan pre-commit cmake-format
    - name: Setup Conan
      run: |
        conan profile detect --force
        conan install . -s build_type=${{ matrix.build_type }} -s compiler.cppstd=23 --output-folder=build --build=missing
    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCXXPROBE_ENABLE_ASAN=${{ matrix.asan || 'OFF' }} -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake
    - name: Build
      run: cmake --build build --parallel
    - name: Run tests
      run: ctest --test-dir build --output-on-failure --timeout 60
    - name: Pre-commit checks
      run: pre-commit run --all-files
    - name: Cppcheck
      run: cmake --build build --target cppcheck
    - name: Clang-tidy (only clang)
      if: matrix.cxx == 'clang++'
      run: cmake --build build --target cxxprobe
